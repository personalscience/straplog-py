[project]
name = "straplog"
version = "0.2.0"
description = "Read StrapLog exports (Polar H10 RR intervals in SQLite) and compute HRV: library and CLI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Richard Sprague" }]
requires-python = ">=3.11"
dependencies = ["numpy", "pandas"]
keywords = ["hrv", "polar-h10", "rr-intervals", "dfa-alpha1", "heart-rate-variability"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
plot = ["plotnine"]

[project.urls]
Homepage = "https://github.com/personalscience/straplog-py"

[project.scripts]
straplog = "straplog.cli:main"

[dependency-groups]
dev = ["pytest", "plotnine"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
